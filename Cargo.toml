[workspace]
members = ["crates/hub"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22"
fl-core = { git = "https://github.com/Artificial-Humanity/FerroLoop.git", package = "fl-core" }
fl-exec = { git = "https://github.com/Artificial-Humanity/FerroLoop.git", package = "fl-exec" }
fl-gate = { git = "https://github.com/Artificial-Humanity/FerroLoop.git", package = "fl-gate" }
fl-github = { git = "https://github.com/Artificial-Humanity/FerroLoop.git", package = "fl-github" }
fl-store = { git = "https://github.com/Artificial-Humanity/FerroLoop.git", package = "fl-store" }
fl-wire = { git = "https://github.com/Artificial-Humanity/FerroLoop.git", package = "fl-wire" }
flate2 = "1.1"
globset = "0.4.20"
libc = "0.2"
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
# ⚠ Never enable `preserve_order`: the GitHub ledger reads a line only when
# re-encoding it gives the same bytes, which needs a `Value`'s keys sorted.
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time"] }
toml = "1.1"
ureq = { version = "3.4", features = ["json"] }
uuid = { version = "1.26", features = ["v7"] }
walkdir = "2.5.0"
